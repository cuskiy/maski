<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; connect-src *" />
    <title>maski</title>
    <meta name="description" content="A fast, local-first Matrix client" />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/styles/style.css" />

  <body>
    <div id="app">
      <div class="boot" id="boot">
        <div class="boot-screen" aria-busy="true">

          <span class="spinner" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <noscript>
      <div class="nojs">
        <div class="nojs-card">
          <p class="brand">maski</p>
          <h1>JavaScript is required</h1>
          <p>Matrix sync and end-to-end encryption run in your browser, so this client cannot start without JavaScript.</p>
          <p><a class="link" href="/zh-CN/">简体中文</a></p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/app/main.ts"></script>
